<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e6b73">
<link rel="manifest" href="manifest.json">
<title>ChimexVPN</title>
<style>
:root{--bg:#eef2f4;--card:#fff;--ink:#12222b;--mute:#5b6b74;--line:#d3dde2;--accent:#0e6b73;--on:#fff;--amber:#e8a317;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#0d1a20;--card:#14262e;--ink:#e6eef1;--mute:#93a6af;--line:#26404b;--accent:#4fb3bd;--on:#08161b;--amber:#f0b73d;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:20px 18px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:26px;margin:0;letter-spacing:-.5px;font-weight:800}
.pill{font-size:13px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mute);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--amber)}
.pill.on .dot{background:#2e9e5b}
main{padding:8px 18px 90px;max-width:560px;margin:auto}
.lead{color:var(--mute);margin:0 0 16px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.name{font-weight:700;font-size:17px}.meta{color:var(--mute);font-size:14px;word-break:break-all}
.tag{font-size:12px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:1px 7px;white-space:nowrap}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:9px 14px}
button.primary{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:700}
button.del{color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
input,select{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.two{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.chk{display:flex;gap:10px;align-items:center;margin-top:14px}.chk input{width:auto}.chk label{margin:0}
.hint{font-size:13px;color:var(--mute);margin-top:4px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));box-shadow:0 6px 20px #0004;padding:14px 20px;border-radius:99px}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
pre{white-space:pre-wrap;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;margin:10px 0 0}
dialog{border:none;border-radius:16px;padding:18px;width:min(92vw,520px);background:var(--card);color:var(--ink);max-height:90vh}
dialog::backdrop{background:#000a}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.foot{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <h1>ChimexVPN</h1>
  <div class="pill" id="net"><span class="dot"></span><span id="netTxt">Checking</span></div>
</header>
<main>
  <p class="lead">Your server profiles in one place. Add a server you run, copy its share link, and paste it into a client app such as v2rayNG.</p>
  <div id="list"></div>
  <div class="foot">
    <button id="exp">Export backup</button>
    <button id="imp">Import backup</button>
    <input type="file" id="file" accept="application/json" hidden>
  </div>
</main>
<button class="primary fab" id="add">Add server</button>

<dialog id="dlg">
  <h2 id="dTitle" style="margin:0 0 4px">Add server</h2>
  <label for="f_name">Name</label><input id="f_name" placeholder="Canada VPS">
  <label for="f_proto">Protocol</label>
  <select id="f_proto"><option value="vless">VLESS</option><option value="trojan">Trojan</option></select>
  <div class="two">
    <div><label for="f_addr">Server address</label><input id="f_addr" placeholder="vpn.yourdomain.com" autocapitalize="none"></div>
    <div><label for="f_port">Port</label><input id="f_port" type="number" value="443"></div>
  </div>
  <label for="f_id" id="idLbl">UUID</label><input id="f_id" autocapitalize="none">
  <div class="actions" style="margin-top:6px"><button id="gen" type="button">Generate UUID</button></div>
  <label for="f_net">Transport</label>
  <select id="f_net"><option value="ws">WebSocket</option><option value="tcp">TCP</option></select>
  <label for="f_path">WebSocket path</label><input id="f_path" value="/ws" autocapitalize="none">
  <label for="f_host">Host / SNI</label><input id="f_host" placeholder="Your own domain" autocapitalize="none">
  <div class="hint">Use the domain of your own server and its TLS certificate.</div>
  <div class="chk"><input type="checkbox" id="f_tls" checked><label for="f_tls">Use TLS</label></div>
  <div class="actions" style="margin-top:20px">
    <button class="primary" id="save">Save server</button>
    <button id="cancel">Cancel</button>
  </div>
</dialog>

<dialog id="linkDlg">
  <h2 style="margin:0">Share link</h2>
  <pre id="linkTxt"></pre>
  <div class="actions"><button class="primary" id="copy">Copy link</button><button id="closeLink">Close</button></div>
</dialog>
<div class="toast" id="toast"></div>

<script>
const KEY='chimexvpn.servers';
const $=id=>document.getElementById(id);
let servers=[],editing=null;
function load(){try{servers=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){servers=[]}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(servers))}catch(e){toast('Could not save. Storage is blocked.')}}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2000)}
function uuid(){return crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c=='x'?r:r&3|8).toString(16)})}
function link(s){
  const q=new URLSearchParams({type:s.net,security:s.tls?'tls':'none'});
  if(s.net==='ws'){q.set('path',s.path||'/');if(s.host)q.set('host',s.host)}
  if(s.tls&&s.host)q.set('sni',s.host);
  if(s.proto==='vless')q.set('encryption','none');
  return `${s.proto}://${encodeURIComponent(s.id)}@${s.addr}:${s.port}?${q}#${encodeURIComponent(s.name)}`;
}
function render(){
  const l=$('list');l.innerHTML='';
  if(!servers.length){l.innerHTML='<div class="empty">No servers yet. Tap Add server to create your first profile.</div>';return}
  servers.forEach((s,i)=>{
    const c=document.createElement('div');c.className='card';
    const r=document.createElement('div');r.className='row';
    const a=document.createElement('div');
    const n=document.createElement('div');n.className='name';n.textContent=s.name;
    const m=document.createElement('div');m.className='meta';m.textContent=`${s.addr}:${s.port} · ${s.net==='ws'?'WebSocket':'TCP'}${s.tls?' · TLS':''}`;
    a.append(n,m);
    const t=document.createElement('span');t.className='tag';t.textContent=s.proto.toUpperCase();
    r.append(a,t);
    const act=document.createElement('div');act.className='actions';
    [['Share link',()=>showLink(i),''],['Edit',()=>openForm(i),''],['Delete',()=>del(i),'del']].forEach(([x,f,k])=>{
      const b=document.createElement('button');b.textContent=x;if(k)b.className=k;b.onclick=f;act.append(b)});
    c.append(r,act);l.append(c);
  });
}
function openForm(i){
  editing=i;const s=i==null?{name:'',proto:'vless',addr:'',port:443,id:uuid(),net:'ws',path:'/ws',host:'',tls:true}:servers[i];
  $('dTitle').textContent=i==null?'Add server':'Edit server';
  $('f_name').value=s.name;$('f_proto').value=s.proto;$('f_addr').value=s.addr;$('f_port').value=s.port;
  $('f_id').value=s.id;$('f_net').value=s.net;$('f_path').value=s.path;$('f_host').value=s.host;$('f_tls').checked=s.tls;
  idLabel();$('dlg').showModal();
}
function idLabel(){const t=$('f_proto').value==='trojan';$('idLbl').textContent=t?'Password':'UUID';$('gen').style.display=t?'none':''}
$('f_proto').onchange=idLabel;
$('gen').onclick=()=>{$('f_id').value=uuid()};
$('add').onclick=()=>openForm(null);
$('cancel').onclick=()=>$('dlg').close();
$('save').onclick=()=>{
  const s={name:$('f_name').value.trim(),proto:$('f_proto').value,addr:$('f_addr').value.trim(),port:parseInt($('f_port').value,10),
    id:$('f_id').value.trim(),net:$('f_net').value,path:$('f_path').value.trim()||'/',host:$('f_host').value.trim(),tls:$('f_tls').checked};
  if(!s.name||!s.addr||!s.id||!(s.port>0&&s.port<65536)){toast('Fill in name, address, port and ID.');return}
  if(editing==null)servers.push(s);else servers[editing]=s;
  persist();render();$('dlg').close();toast('Saved');
};
function del(i){if(confirm(`Delete "${servers[i].name}"?`)){servers.splice(i,1);persist();render();toast('Deleted')}}
function showLink(i){$('linkTxt').textContent=link(servers[i]);$('linkDlg').showModal()}
$('closeLink').onclick=()=>$('linkDlg').close();
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('linkTxt').textContent);toast('Copied')}catch(e){toast('Press and hold the text to copy.')}};
$('exp').onclick=()=>{
  const b=new Blob([JSON.stringify(servers,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='chimexvpn-backup.json';a.click();
};
$('imp').onclick=()=>$('file').click();
$('file').onchange=async e=>{
  try{const d=JSON.parse(await e.target.files[0].text());
    if(!Array.isArray(d))throw 0;servers=servers.concat(d.filter(x=>x&&x.name&&x.addr&&x.id));persist();render();toast('Imported')}
  catch(err){toast('That file is not a valid backup.')}
  e.target.value='';
};
function net(){const o=navigator.onLine;$('net').classList.toggle('on',o);$('netTxt').textContent=o?'Online':'Offline'}
addEventListener('online',net);addEventListener('offline',net);net();
load();render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
